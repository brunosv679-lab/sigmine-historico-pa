# Nginx — SIGMINE Histórico PA
# Porta dedicada 8085 (Gunicorn na porta 8001)
# Não conflita com pga-kriging (80/8080) nem com outras aplicações

server {
    listen 8085;
    server_name _;

    access_log /var/log/nginx/sigmine_access.log;
    error_log  /var/log/nginx/sigmine_error.log;

    # Arquivos estáticos diretamente pelo Nginx (melhor performance)
    location /static/ {
        alias /home/nathan/sigmine-historico-pa/app/views/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering    off;
    }

    # Compressão gzip para respostas JSON/HTML
    gzip            on;
    gzip_comp_level 5;
    gzip_types      application/json text/html text/css application/javascript;
}
