{% extends "base.html" %}

{% block title %}Mapa — SIGMINE Histórico PA{% endblock %}

{% block content %}
<div class="row g-0" style="height: calc(100vh - 56px - 40px)">

  <!-- Painel lateral -->
  <div class="col-lg-3 col-md-4 sidebar-panel overflow-auto" id="sidebar">
    <div class="p-3 border-bottom border-secondary">
      <h6 class="text-warning fw-bold mb-2">
        <i class="bi bi-funnel-fill me-1"></i>Filtros
      </h6>

      <!-- Filtro Fase -->
      <div class="mb-2">
        <label class="form-label small text-muted mb-1">Fase do Processo</label>
        <select class="form-select form-select-sm bg-dark text-light border-secondary" id="filtroFase">
          <option value="">Todas as fases</option>
          {% for f in fases %}
          <option value="{{ f }}">{{ f }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Filtro Substância -->
      <div class="mb-2">
        <label class="form-label small text-muted mb-1">Substância</label>
        <select class="form-select form-select-sm bg-dark text-light border-secondary" id="filtroSubstancia">
          <option value="">Todas</option>
          {% for s in substancias %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <button class="btn btn-warning btn-sm w-100" id="btnFiltrar">
        <i class="bi bi-search me-1"></i>Atualizar Mapa
      </button>
    </div>

    <!-- Stats -->
    <div class="p-3 border-bottom border-secondary">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <small class="text-muted">Processos no Pará</small>
        <span class="badge bg-info text-dark" id="totalProcessos">{{ total_processos }}</span>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <small class="text-muted">Carregados no mapa</small>
        <span class="badge bg-secondary" id="carregados">0</span>
      </div>
    </div>

    <!-- Painel de detalhe do processo -->
    <div class="p-3" id="painelDetalhe" style="display:none">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="text-info mb-0"><i class="bi bi-info-circle me-1"></i>Processo</h6>
        <button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('painelDetalhe').style.display='none'">
          <i class="bi bi-x"></i>
        </button>
      </div>
      <div id="detalheConteudo" class="small"></div>

      <!-- Timeline -->
      <div class="mt-3">
        <h6 class="text-warning small mb-2"><i class="bi bi-clock-history me-1"></i>Linha do Tempo</h6>
        <div id="timeline" class="timeline-container"></div>
      </div>
    </div>

    <!-- Legenda -->
    <div class="p-3">
      <h6 class="text-muted small mb-2">Legenda — Fase</h6>
      <div id="legenda" class="legenda-container"></div>
    </div>
  </div>

  <!-- Mapa -->
  <div class="col-lg-9 col-md-8 p-0">
    <div id="map" style="height:100%; width:100%"></div>
    <!-- Loading -->
    <div id="mapLoading" class="map-loading d-none">
      <div class="spinner-border text-warning" role="status"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
